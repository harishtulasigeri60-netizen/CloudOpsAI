<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b16"><meta name="color-scheme" content="dark light"><title>{% block title %}CloudOpsAI{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head>
<body class="auth"><div class="auth-bg"><div class="auth-grid"></div><div class="auth-glow"></div></div><div class="auth-tools"><button class="icon-btn theme-btn" type="button" data-action="theme" title="Switch theme" aria-label="Switch theme"><span data-theme-icon>☾</span></button></div><main class="auth-shell"><a class="back" href="{{ url_for('home') }}">← CloudOpsAI</a><div class="auth-card"><div class="auth-side"><span class="pill">AWS CLOUD OPERATIONS</span><h1>{% block heading %}{% endblock %}</h1><p>{% block copy %}{% endblock %}</p><div class="mini-flow"><span>EC2</span><i>→</i><span>CloudWatch</span><i>→</i><span>CloudOpsAI</span></div></div><div class="auth-form-side">{% block form %}{% endblock %}<div class="auth-footer">{% block footer %}{% endblock %}</div></div></div></main><script src="{{ url_for('static',filename='js/dashboard.js') }}"></script></body></html>
