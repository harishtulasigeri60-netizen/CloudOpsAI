<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b16"><meta name="color-scheme" content="dark light"><title>{{ error_code|default(500) }} — CloudOpsAI</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="error-page"><div class="error-tools"><button class="icon-btn theme-btn" type="button" data-action="theme" aria-label="Switch theme"><span data-theme-icon>☾</span></button></div><main class="auth-shell"><div class="panel error-panel"><div class="error-code">{{ error_code|default(500) }}</div><h1>{{ error_title|default('Something went wrong') }}</h1><p class="muted">{{ error_message|default('CloudOpsAI could not complete this request.') }}</p><div class="error-actions"><button class="ghost-btn" type="button" data-action="back-dashboard">← Go back</button><a class="primary-btn" href="{{ url_for('home') }}">Return to CloudOpsAI</a></div></div></main><script src="{{ url_for('static',filename='js/dashboard.js') }}"></script></body></html>
